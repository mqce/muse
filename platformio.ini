[platformio]
default_envs = muse

[env:muse]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.4
    lewisxhe/SensorLib@^0.3.1

extra_scripts =
    pre:tools/convert_faces.py
    tools/fix_includes.py

monitor_speed = 115200
